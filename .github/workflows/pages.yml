name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissões que o deploy do Pages exige
permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; não cancela o que já está no ar
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true liga o Pages sozinho na primeira execução
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # O site é estático: sobe a raiz do repositório como está
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
